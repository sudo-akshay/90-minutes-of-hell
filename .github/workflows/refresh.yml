name: Refresh data

on:
  workflow_dispatch:
  schedule:
    # Tuesdays at 12:00 IST (06:30 UTC). GitHub may start it a little late when busy.
    - cron: "30 6 * * 2"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch league data
        run: python fetch.py

      - name: Project next 3 gameweeks
        run: python predict.py

      - name: Build page
        run: python build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh league data"
            git push
          fi
